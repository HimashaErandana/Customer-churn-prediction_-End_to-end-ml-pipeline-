
name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  ECR_REPOSITORY: churn-prediction-api
  AWS_REGION: ap-southeast-2

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ruff
        run: ruff check src/ api/ run_pipeline.py

      - name: Run black check
        run: black --check src/ api/ run_pipeline.py

      - name: Run isort check
        run: isort --check-only src/ api/ run_pipeline.py

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run mypy strict
        run: mypy --strict src/ api/

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests with coverage
        run: pytest tests/unit/ --cov=src --cov=api --cov-fail-under=80

  verify-model:
    name: Verify Approved Model Artifact
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt joblib

      - name: Verify approved deployment model artifact exists
        run: |
          ARTIFACT="deployment/model/model.pkl"
          if [ ! -f "$ARTIFACT" ]; then
            echo "ERROR: Approved model artifact not found at $ARTIFACT"
            echo "Train and export the model locally, then commit deployment/model/model.pkl before pushing."
            exit 1
          fi

      - name: Validate model artifact contents
        run: |
          python3 << 'PYEOF'
          import joblib
          from pathlib import Path

          artifact = Path('deployment/model/model.pkl')
          data = joblib.load(artifact)

          required_keys = ['model', 'label_encoders', 'feature_names', 'metadata']
          for key in required_keys:
              if key not in data:
                  raise SystemExit(f'ERROR: Missing required key in model artifact: {key}')

          metadata = data.get('metadata', {})
          if 'best_experiment' not in metadata:
              raise SystemExit('ERROR: Missing best_experiment in model artifact metadata')

          print(f'Model artifact valid: experiment={metadata["best_experiment"]}')
          print(f'Features: {len(data["feature_names"])}')
          print(f'Encoders: {len(data["label_encoders"])}')
          PYEOF

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: verify-model
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest \
            -f Dockerfile.prod .

      - name: Push Docker image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy to EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          echo "${EC2_SSH_KEY}" > /tmp/ec2_key
          chmod 600 /tmp/ec2_key

          ssh -o StrictHostKeyChecking=no -i /tmp/ec2_key ec2-user@${EC2_HOST} "bash -s -- '${IMAGE_URI}'" << 'EOF'
            set -e

            IMAGE_URI="$1"

            aws ecr get-login-password --region ap-southeast-2 | sudo docker login --username AWS --password-stdin 782083515169.dkr.ecr.ap-southeast-2.amazonaws.com

            sudo docker pull "${IMAGE_URI}"

            sudo docker stop churn-api || true
            sudo docker rm churn-api || true

            sudo docker run -d \
              --name churn-api \
              -p 80:8000 \
              -e ENVIRONMENT=production \
              -e API_HOST=0.0.0.0 \
              -e API_PORT=8000 \
              --restart unless-stopped \
              "${IMAGE_URI}"

            sleep 10
            curl -f http://localhost/health
          EOF
