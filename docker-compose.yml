services:
  mlflow:
    image: python:3.12-slim
    working_dir: /app
    environment:
      - MLFLOW_ALLOW_FILE_STORE=true
    volumes:
      - ./mlruns:/app/mlruns
      - ./mlartifacts:/app/mlartifacts
    command: >
      sh -c "pip install --no-cache-dir --upgrade pip mlflow &&
             mlflow server --host 0.0.0.0 --port 5000
             --backend-store-uri /app/mlruns
             --default-artifact-root /app/mlartifacts"
    ports:
      - "5000:5000"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_EXPERIMENT_NAME=churn-prediction/xgboost
      - MLFLOW_ALLOW_FILE_STORE=true
      - MODEL_NAME=CustomerChurnXGBoost
      - MODEL_STAGE=Production
      - ENVIRONMENT=local
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - ./src:/app/src
      - ./api:/app/api
      - ./src/config/config.yaml:/app/src/config/config.yaml
      - ./model:/app/model
      - ./.env:/.env
    ports:
      - "8000:8000"
    depends_on:
      mlflow:
        condition: service_started
